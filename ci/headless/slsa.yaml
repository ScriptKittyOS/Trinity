#
# The SLSA build level this project claims for the headless image it publishes (slice 131), with
# the reason for it and the reason it is not the next one. `mix trinity.image.slsa` reads the
# publishing workflow, works out the level its mechanism supports, and fails the quality gate
# when the claim below is higher, or is L2 or more without a run that verified. The same level is
# stated in docs/regulated/image-verify.md, and a test holds the two equal.
#
# Levels are the SLSA build track's (slsa-framework/slsa, spec/build-track-basics.md).
build_level: 1

reason: >-
  Every published image carries provenance (https://slsa.dev/provenance/v1) naming the builder,
  the source repository and the exact commit, with every other input by digest, signed with the
  project's held key and attached to the image's digest. The build is scripted
  (scripts/headless_image.sh) and runs on GitHub-hosted runners.

not_next: >-
  L2 requires the build platform to generate and sign the provenance itself. This provenance is
  generated by a step of the publishing job (mix trinity.image.provenance) and signed with a key
  that job can read, so a compromised build step could forge it. The job also asks GitHub for its
  own platform provenance (actions/attest-build-provenance, which GitHub documents as Build L2),
  but that has not yet run; the claim rises to L2 when a run of it has verified, with that run
  listed below. Neither path is L3: the provenance is made in the same job as the build's own
  steps, not by an isolated reusable workflow.

# Workflow runs whose platform provenance verified (`gh attestation verify` passing in the
# publishing job). Required for a claim of L2 or more.
evidence: []
