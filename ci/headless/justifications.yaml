#
# Justifications for High and Critical findings of the vulnerability scan of the headless image
# (slice 130, AC3 and AC4; docs/regulated/headless-image.md). `mix trinity.image.findings` fails on
# a High or Critical finding with no row here, and on a row whose finding the scan no longer
# reports.
#
# A row is keyed the way Iron Bank's Vulnerability Assessment Tracker keys a finding: `finding`,
# `package` as name-version, and `packagePath`, which is null for a package the OS package database
# reports (their `pkgdb`). So a row covers one version of one package, and upgrading the package
# retires it.
#
# What a justification here must be: facts someone else can check, with the command or file that
# shows them. "Not exploitable" with no evidence is not one. A finding that has a fix available is
# fixed, not justified: the OTP findings fixed in 28.5.0.7 never had rows, and moving the container
# images to 28.5.0.7 fixed them (ADR-0014).
#
# The ERTS facts below were re-read in OTP 28.5.0.7's source on 2026-10-08, when the image moved to
# it: `erts/emulator/pcre/pcre2.h` gives PCRE2_MAJOR 10, PCRE2_MINOR 47; the directory's 39 files
# include no pcre2_jit_*.c and no pcre2_dfa_match.c (`tar -tzf otp_src_28.5.0.7.tar.gz`).
---
justifications:
  # Retired 2026-10-19, from the scan of run 39257269071 (grype database built 2026-10-19T06:39Z):
  # the six pcre2 and pcre2-syntax rows, because the base now carries 10.40-7.el9_8, against which
  # none of CVE-2026-86145, CVE-2026-89161 or CVE-2026-103111 is reported; and the
  # CVE-2026-84782 row, because Red Hat's security data names openssl-1:3.5.8-2.el9_8, the build in
  # this image, as the fixed release (RHSA-2026:77396).
  #
  # openssl-libs: added by this image (the crypto NIF links libcrypto). Red Hat lists no fix for the
  # finding below; `dnf upgrade` ran against the installroot at build time, so this is the newest
  # build UBI's repositories carried. Re-pinned 2026-10-08 from 3.5.8-1 to Red Hat's 3.5.8-2
  # rebuild.
  - finding: "CVE-2026-75804"
    package: "openssl-libs-1:3.5.8-2.el9_8"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      The flaw is in OpenSSL's QUIC stack (connection-level flow control), which lives in
      libssl. No executable or shared object in this image declares libssl.so.3 as a dependency
      (readelf -d over all of them); Erlang's crypto NIF links libcrypto alone, and OTP's ssl
      application implements TLS in Erlang without libssl. Red Hat lists no fix; the build ran dnf
      upgrade, so this is the newest openssl-libs UBI carried.
