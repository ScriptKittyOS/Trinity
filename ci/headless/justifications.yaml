#
# Justifications for High and Critical findings of the vulnerability scan of the headless image
# (slice 130, AC3 and AC4; docs/regulated/headless-image.md). `mix trinity.image.findings` fails on
# a High or Critical finding with no row here, and on a row whose finding the scan no longer
# reports.
#
# A row is keyed the way Iron Bank's Vulnerability Assessment Tracker keys a finding: `finding`,
# `package` as name-version, and `packagePath`, which is null for a package the OS package database
# reports (their `pkgdb`). So a row covers one version of one package, and upgrading the package
# retires it.
#
# What a justification here must be: facts someone else can check, with the command or file that
# shows them. "Not exploitable" with no evidence is not one. A finding that has a fix available is
# fixed, not justified: the OTP findings fixed in 28.5.0.7 have no rows, on purpose (slice 130
# NOTES, D-130-9).
---
justifications:
  # pcre2: inherited from ubi9-micro 9.8, whose own scan reports the same three CVEs on the same
  # two packages. Red Hat lists no fix (grype fix state `not-fixed`, Red Hat's namespace).
  - finding: "CVE-2026-86145"
    package: "pcre2-10.40-6.el9"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      Inherited from the ubi9-micro 9.8 base image, which reports the same finding; Red Hat lists
      no fix. The flaw is in pcre2_jit_match. In this image libpcre2-8 is linked only by the base's
      libselinux and libpcre2-posix (readelf -d over every executable and shared object); the
      Erlang runtime does not link it, and the PCRE2 copy ERTS compiles in (erts/emulator/pcre,
      10.47) contains no JIT source (no pcre2_jit_*.c in OTP 28.5.0.5's tree).
  - finding: "CVE-2026-86145"
    package: "pcre2-syntax-10.40-6.el9"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      The syntax-data subpackage of the pcre2 finding of the same identifier: inherited from the
      ubi9-micro 9.8 base image, Red Hat lists no fix, and the JIT code the flaw is in is not
      loaded by anything Trinity runs (see the pcre2 row).
  - finding: "CVE-2026-89161"
    package: "pcre2-10.40-6.el9"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      Inherited from the ubi9-micro 9.8 base image, which reports the same finding; Red Hat lists
      no fix. The flaw needs an attacker-controlled pattern and the JIT API. libpcre2-8 is linked
      only by the base's libselinux and libpcre2-posix; the Erlang runtime does not link it, and
      ERTS's own PCRE2 10.47 copy contains no JIT source.
  - finding: "CVE-2026-89161"
    package: "pcre2-syntax-10.40-6.el9"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      The syntax-data subpackage of the pcre2 finding of the same identifier: inherited from the
      ubi9-micro 9.8 base image, Red Hat lists no fix, and the JIT code the flaw is in is not
      loaded by anything Trinity runs (see the pcre2 row).
  - finding: "CVE-2026-103111"
    package: "pcre2-10.40-6.el9"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      Inherited from the ubi9-micro 9.8 base image, which reports the same finding; Red Hat lists
      no fix. The flaw is in pcre2_dfa_match. libpcre2-8 is linked only by the base's libselinux
      and libpcre2-posix; the Erlang runtime does not link it, and ERTS's own PCRE2 10.47 copy has
      no pcre2_dfa_match.c (erts/emulator/pcre in OTP 28.5.0.5).
  - finding: "CVE-2026-103111"
    package: "pcre2-syntax-10.40-6.el9"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      The syntax-data subpackage of the pcre2 finding of the same identifier: inherited from the
      ubi9-micro 9.8 base image, Red Hat lists no fix, and the DFA matcher the flaw is in is not
      loaded by anything Trinity runs (see the pcre2 row).

  # openssl-libs: added by this image (the crypto NIF links libcrypto). Red Hat lists no fix for
  # either; `dnf upgrade` ran against the installroot at build time, so this is the newest build
  # UBI's repositories carried.
  - finding: "CVE-2026-75804"
    package: "openssl-libs-1:3.5.8-1.el9_8"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      The flaw is in OpenSSL's QUIC stack (connection-level flow control), which lives in
      libssl. No executable or shared object in this image declares libssl.so.3 as a dependency
      (readelf -d over all of them); Erlang's crypto NIF links libcrypto alone, and OTP's ssl
      application implements TLS in Erlang without libssl. Red Hat lists no fix; the build ran dnf
      upgrade, so this is the newest openssl-libs UBI carried.
  - finding: "CVE-2026-84782"
    package: "openssl-libs-1:3.5.8-1.el9_8"
    packagePath: null
    severity: "high"
    scanSource: "grype"
    justification: >-
      The flaw is in OpenSSL's DTLS retransmission, which lives in libssl. No executable or shared
      object in this image declares libssl.so.3 as a dependency (readelf -d over all of them);
      Erlang's crypto NIF links libcrypto alone, and OTP's ssl application implements DTLS in
      Erlang without libssl. Red Hat lists no fix; the build ran dnf upgrade, so this is the
      newest openssl-libs UBI carried.
