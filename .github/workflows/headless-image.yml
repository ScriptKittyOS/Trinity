#
# Slice 130: builds the hardened headless image from ci/ironbank/Dockerfile the way Iron Bank's
# pipeline would (scripts/headless_image.sh stages every input from hardening_manifest.yaml and
# checks its digest; the Dockerfile reaches no network), then checks the built image, never its
# recipe (docs/regulated/headless-image.md):
#
#   the submission tree and the published build's base pins   mix trinity.ironbank.lint
#   the image starts its runtime                              bin/headless eval, then start
#   AC1 and AC6: user and layer contents                      mix trinity.image.inspect
#   AC3 and AC4: vulnerability scan against justifications    grype, then mix trinity.image.findings
#   AC5: STIG applicability statement                         scripts/stig_scan.sh, then mix trinity.image.stig
#
# Every check after the build runs and reports even when an earlier one fails, so one red check
# does not hide the others; the job fails if any did. It runs when an input of the image or of the
# checks changes, on demand, and daily, because new advisories appear against an image that has
# not changed (Iron Bank rescans its images on a schedule for the same reason). Nothing is pushed:
# publishing and signing the image is slice 131's.
name: headless-image

on:
  push:
    paths:
      - ci/ironbank/**
      - ci/headless/**
      - scripts/headless_image.sh
      - scripts/image_supply_chain.sh
      - scripts/stig_scan.sh
      - docs/regulated/image-verify.md
      - lib/mix/tasks/trinity.ironbank.lint.ex
      - lib/mix/tasks/trinity.image.*.ex
      - mix.exs
      - mix.lock
      - config/**
      - .tool-versions
      - .github/workflows/headless-image.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.digest }}
    # Not measured on a runner yet: OTP from source took 40 s and the dependency compile, EXLA's C++
    # included, about 155 s on a 32-core machine (slice 130 NOTES). The ceiling is generous until the
    # first runs say otherwise.
    timeout-minutes: 120
    env:
      IMAGE: trinity-headless:ci
      # grype v0.119.0, pinned by digest: a scanner is code that reads the image and runs in CI, and
      # a tag can be moved (slice 130 NOTES, D-130-6).
      GRYPE: anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-image-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-image-

      - name: Compile the checks
        run: |
          mix deps.get
          mix compile

      - name: The submission tree and the published build's base pins
        run: mix trinity.ironbank.lint

      - name: Build the image from staged, digest-checked resources
        id: build
        run: |
          scripts/headless_image.sh build "$IMAGE"
          docker image inspect "$IMAGE" --format 'id={{.Id}} size={{.Size}} user={{.Config.User}}'
          echo "digest=$(docker image inspect "$IMAGE" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      # `bin/headless version` exits 0 without starting the VM (slice 130 NOTES, measurement 1), so
      # this starts it: eval runs the runtime, and start must answer on its one port with a 401 for a
      # request without the bearer.
      - name: The image starts its runtime, read-only
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --read-only --tmpfs /tmp "$IMAGE" /opt/trinity/bin/headless eval \
            'IO.puts("otp=#{System.otp_release()} fips_provider=#{inspect(:crypto.info()[:fips_provider_available])} node=#{inspect(Node.self())}")'
          cid=$(docker run -d --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:4000:4000 -e TRINITY_MCP_SERVER_TOKEN=ci-token "$IMAGE")
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:4000/ && break
            sleep 1
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4000/mcp \
            -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          docker logs "$cid" | tail -20
          docker rm -f "$cid" >/dev/null
          echo "POST /mcp without a bearer: $status"
          test "$status" = 401

      - name: "AC1 and AC6: the image's user and its layers"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mix trinity.image.inspect "$IMAGE"

      - name: "AC3: scan the image, with no network at scan time"
        id: scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p out/grype-db out/tmp
          docker save "$IMAGE" -o out/image.tar
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/s" -e GRYPE_DB_CACHE_DIR=/s/grype-db "$GRYPE" db update
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD/out:/s" \
            -e TMPDIR=/s/tmp -e GRYPE_DB_CACHE_DIR=/s/grype-db \
            -e GRYPE_DB_AUTO_UPDATE=false -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            "$GRYPE" docker-archive:/s/image.tar -o json --file /s/grype.json
          rm -f out/image.tar

      - name: "AC3 and AC4: findings against ci/headless/justifications.yaml"
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: mix trinity.image.findings --scan out/grype.json --out out/findings.csv

      - name: "AC5: the STIG applicability statement"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          scripts/stig_scan.sh "$IMAGE" out/stig
          mix trinity.image.stig --results out/stig/stig-results.xml --out out/stig/stig-applicability.md \
            --image "$IMAGE" --digest "${{ steps.build.outputs.digest }}"

      # Slice 131: the image the checks above ran on, for `publish`, so the published bytes are
      # the checked bytes rather than a second build of the same commit.
      - name: Hand the checked image to the publishing job
        if: ${{ success() && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        run: |
          set -o pipefail
          docker save "$IMAGE" | gzip -1 > out/image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        with:
          name: headless-image
          path: out/image.tar.gz
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: headless-image-evidence
          path: |
            out/grype.json
            out/findings.csv
            out/stig/stig-results.xml
            out/stig/stig-report.html
            out/stig/stig-applicability.md
          if-no-files-found: warn

  # Slice 131 (docs/regulated/image-verify.md). The signing key is a held key, not a public
  # transparency log (NOTES D-131-1): its private half and password are repository secrets, and its
  # public half is ci/headless/cosign.pub, which the second step below holds them to.
  publish:
    needs: image
    if: ${{ github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The registry push, and the signatures and attestations stored beside the image.
      packages: write
      # GitHub's platform provenance: `id-token` mints the workflow's identity, `attestations`
      # records the statement. Neither grants anything else.
      id-token: write
      attestations: write
    env:
      IMAGE: trinity-headless:ci
      # cosign v3.1.3, the release binary checked against the digest its cosign_checksums.txt gives.
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      # CycloneDX's own validator, pinned by digest: the bills are checked against the schema
      # before they are attested.
      CYCLONEDX_CLI: cyclonedx/cyclonedx-cli:0.33.1@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-publish-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-publish-

      - name: Compile the tasks that write the bills
        run: |
          mix deps.get
          mix compile

      - name: Install cosign, checked against its release digest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: The signing key is the one whose public half is in the tree
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -f ci/headless/cosign.pub || { echo "::error::ci/headless/cosign.pub is not in the tree"; exit 1; }
          test -n "$COSIGN_PRIVATE_KEY" || { echo "::error::the COSIGN_PRIVATE_KEY secret is not set"; exit 1; }
          mkdir -p out
          cosign public-key --key env://COSIGN_PRIVATE_KEY > out/derived.pub
          want=$(openssl pkey -pubin -in ci/headless/cosign.pub -outform DER | sha256sum)
          got=$(openssl pkey -pubin -in out/derived.pub -outform DER | sha256sum)
          test "$want" = "$got" || { echo "::error::the secret key's public half is not ci/headless/cosign.pub"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: headless-image
          path: out

      - name: Push the checked image, by digest
        id: push
        run: |
          set -o pipefail
          gunzip -c out/image.tar.gz | docker load
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "${{ needs.image.outputs.image-id }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trinity-headless"
          docker tag "$IMAGE" "$repo:$GITHUB_SHA"
          docker push "$repo:$GITHUB_SHA"
          digest=$(docker image inspect "$repo:$GITHUB_SHA" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $repo@$digest"

      - name: The bills, each checked before it is attested
        env:
          REPO: ${{ steps.push.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mix trinity.image.provenance --image "$IMAGE" --commit "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --builder-id "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --out out/provenance.json
          mix trinity.sbom out/sbom.cdx.json
          mix trinity.image.aibom --out out/ai-bom.cdx.json --image "$REPO" --digest "$DIGEST"
          for bom in sbom.cdx.json ai-bom.cdx.json; do
            docker run --rm -v "$PWD/out:/w:ro" "$CYCLONEDX_CLI" validate \
              --input-file "/w/$bom" --input-version v1_6 --fail-on-errors
          done

      - name: Sign the image and attach its provenance, SBOM and AI-BOM, with the held key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          scripts/image_supply_chain.sh attach "${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}" \
            --key env://COSIGN_PRIVATE_KEY \
            --provenance out/provenance.json --sbom out/sbom.cdx.json --aibom out/ai-bom.cdx.json

      # GitHub's own build provenance for the same digest, generated and signed by the platform
      # through the workflow's identity and recorded in the public Sigstore log. This is the
      # mechanism ci/headless/slsa.yaml would need for a claim of Build L2.
      - name: Ask GitHub for its platform provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the platform provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}" \
            --repo "$GITHUB_REPOSITORY"
          echo "gh attestation verify: PASS for ${{ steps.push.outputs.digest }}"

      # The page's sequence, extracted from the page, run against a layout of what was pushed, as
      # a stranger with the public key would (test/image_supply_chain_test.exs runs the same text).
      - name: Verify as a consumer would, with the documented sequence
        env:
          PUBKEY: ci/headless/cosign.pub
          COMMIT: ${{ github.sha }}
          REFERENCE_SBOM: out/sbom.cdx.json
        run: |
          set -o pipefail
          cosign save --dir out/layout "${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}"
          sed -n '/<!-- verify:begin -->/,/<!-- verify:end -->/p' docs/regulated/image-verify.md \
            | sed '1,2d' | head -n -2 > out/verify.sh
          LAYOUT=out/layout REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            BUILDER="$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" bash out/verify.sh | tee out/verify.txt
          {
            echo "### ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}"
            echo
            echo '```'
            cat out/verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: headless-image-published
          path: |
            out/provenance.json
            out/sbom.cdx.json
            out/ai-bom.cdx.json
            out/verify.txt
          if-no-files-found: warn
